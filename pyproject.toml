[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas-tui"
description = "TrueNAS Terminal User Interface"
requires-python = ">=3.11"
license = {text = "MIT"}
dynamic = ["version"]
dependencies = ["truenas-api-client"]

[project.scripts]
truenas-tui = "truenas_tui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["truenas_tui*"]

[tool.setuptools.package-data]
truenas_tui = ["locale/**/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]


[tool.ruff]
line-length = 88
# Directories that pytest/sys.path put on the import path, so ruff's isort
# classifies `mock_session` and `gen_locale` as first-party.
src = [".", "tests", "i18n"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # isort
    "I",
]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at `line-length`; E501 only flags what the formatter
# cannot wrap (long strings, comments, docstrings) beyond this limit.
max-line-length = 120

[tool.ruff.lint.isort]
force-sort-within-sections = true
